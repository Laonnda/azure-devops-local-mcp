name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.RUN_INTEGRATION == 'true'
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:int
        env:
          ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_TEST_PROJECT: ${{ secrets.ADO_TEST_PROJECT }}
